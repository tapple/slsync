[project]
name = "slsync"
version = "0.1.0"
description = "Python CLI client for the Second Life viewer's editor WebSocket server"
readme = "README.md"
license = "LGPL-2.1-only"
authors = [
    { name = "tapple", email = "tapplek@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.16.0",
    "click>=8.5.1",
    "websockets>=17.4",
]

[project.scripts]
slsync = "slsync.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
